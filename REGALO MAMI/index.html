<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería de Recuerdos para Mamá</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Georgia', 'Times New Roman', serif;
      background-color: #0d0e0f;
      color: #e2d7c5;
      user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(20,22,25,0.92) 0%, rgba(8,9,10,0.98) 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: opacity 0.4s ease;
      text-align: center;
      padding: 20px;
    }
    #overlay h1 {
      font-size: 2.6rem;
      letter-spacing: 4px;
      color: #d4af37;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    #overlay p {
      font-size: 1.1rem;
      color: #b0a898;
      margin-bottom: 25px;
      max-width: 500px;
      line-height: 1.5;
    }
    .btn-start {
      background: linear-gradient(135deg, #7c622b 0%, #523f19 100%);
      color: #fff;
      padding: 16px 40px;
      border-radius: 4px;
      font-family: inherit;
      font-weight: bold;
      font-size: 1.1rem;
      letter-spacing: 2px;
      border: 1px solid #d4af37;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .btn-start:hover {
      background: linear-gradient(135deg, #997a38 0%, #695222 100%);
      transform: translateY(-2px);
    }
    #hud {
      position: absolute;
      bottom: 25px;
      left: 25px;
      color: #d4af37;
      background: rgba(12, 14, 16, 0.85);
      padding: 12px 22px;
      border-radius: 4px;
      font-size: 0.95rem;
      pointer-events: none;
      border: 1px solid rgba(212, 175, 55, 0.3);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      letter-spacing: 1px;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      background: rgba(212, 175, 55, 0.7);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .controls-info {
      font-size: 0.85rem;
      color: #777;
      margin-top: 30px;
      letter-spacing: 1px;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

  <div id="overlay">
    <h1>GALERÍA DE RECUERDOS PARA MAMÁ</h1>
    <p>Haz clic para iniciar el recorrido por la exhibición.</p>

    <button id="btn-enter" class="btn-start">INGRESAR A LA EXHIBICIÓN</button>

    <div class="controls-info">
      [ WASD ] Desplazamiento | [ MOUSE ] Orientación | [ ESC ] Salir / Menú
    </div>
  </div>

  <div id="crosshair"></div>
  <div id="hud">Ala Principal: <b>Sala I - Colección Clásica</b></div>
  <div id="canvas-container"></div>

  <script>
    // Rutas de las fotos en Fotos/
    const misFotos = Array.from({ length: 40 }, (_, i) => {
      const num = String(i + 1).padStart(2, '0');
      return `Fotos/${num}.jpg`; 
    });

    const container = document.getElementById('canvas-container');
    const overlay = document.getElementById('overlay');
    const hud = document.getElementById('hud');
    const btnEnter = document.getElementById('btn-enter');

    // Escena 3D
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f1115);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.7, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.PointerLockControls(camera, document.body);
    const textureLoader = new THREE.TextureLoader();

    // =========================================================
    // TEXTURAS PROCEDURALES
    // =========================================================

    function createCeilingTexture() {
      const cv = document.createElement('canvas');
      cv.width = 1024; cv.height = 1024;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#1c1b18';
      ctx.fillRect(0, 0, 1024, 1024);

      const size = 128;
      for (let x = 0; x < 1024; x += size) {
        for (let y = 0; y < 1024; y += size) {
          ctx.strokeStyle = '#3a3324';
          ctx.lineWidth = 6;
          ctx.strokeRect(x + 4, y + 4, size - 8, size - 8);

          ctx.strokeStyle = '#6e5621';
          ctx.lineWidth = 3;
          ctx.strokeRect(x + 16, y + 16, size - 32, size - 32);

          ctx.fillStyle = '#141311';
          ctx.fillRect(x + 20, y + 20, size - 40, size - 40);
        }
      }

      const centerX = 512, centerY = 512;
      for (let r = 180; r > 20; r -= 25) {
        ctx.fillStyle = (r % 50 === 0) ? '#8a6e2f' : '#2b2416';
        ctx.beginPath();
        ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#c49a3c';
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      ctx.fillStyle = '#b89235';
      for (let a = 0; a < Math.PI * 2; a += Math.PI / 8) {
        const px = centerX + Math.cos(a) * 90;
        const py = centerY + Math.sin(a) * 90;
        ctx.beginPath();
        ctx.arc(px, py, 18, 0, Math.PI * 2);
        ctx.fill();
      }

      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 1);
      return tex;
    }

    function createWallpaperTexture() {
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 512;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#1e2c22';
      ctx.fillRect(0, 0, 512, 512);

      ctx.fillStyle = '#26382c';
      for (let x = 0; x < 512; x += 64) {
        for (let y = 0; y < 512; y += 64) {
          ctx.beginPath();
          ctx.arc(x + 32, y + 32, 16, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 2);
      return tex;
    }

    function createWoodTexture() {
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 512;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#2c180e';
      ctx.fillRect(0, 0, 512, 512);

      for (let i = 0; i < 30; i++) {
        ctx.fillStyle = `rgba(60, 30, 15, ${0.1 + Math.random() * 0.15})`;
        ctx.fillRect(0, Math.random() * 512, 512, 3 + Math.random() * 6);
      }

      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 1);
      return tex;
    }

    function createParquetTexture() {
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 512;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#3a2518';
      ctx.fillRect(0, 0, 512, 512);
      ctx.fillStyle = '#2a1a10';
      for (let i = 0; i < 512; i += 32) {
        ctx.fillRect(i, 0, 16, 512);
      }
      ctx.strokeStyle = '#140c07';
      ctx.lineWidth = 3;
      for (let j = 0; j < 512; j += 64) {
        ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(512, j); ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(cv);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 12);
      return tex;
    }

    const ceilingTex = createCeilingTexture();
    const wallTex = createWallpaperTexture();
    const woodTex = createWoodTexture();
    const parquetTex = createParquetTexture();

    btnEnter.addEventListener('click', () => controls.lock());

    controls.addEventListener('lock', () => {
      overlay.style.opacity = '0';
      setTimeout(() => overlay.style.display = 'none', 400);
    });

    controls.addEventListener('unlock', () => {
      overlay.style.display = 'flex';
      overlay.style.opacity = '1';
    });

    // Movimiento WASD
    const moveState = { forward: false, backward: false, left: false, right: false };
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();

    window.addEventListener('keydown', (e) => handleKey(e.code, true));
    window.addEventListener('keyup', (e) => handleKey(e.code, false));

    function handleKey(code, state) {
      switch(code) {
        case 'KeyW': case 'ArrowUp': moveState.forward = state; break;
        case 'KeyS': case 'ArrowDown': moveState.backward = state; break;
        case 'KeyA': case 'ArrowLeft': moveState.left = state; break;
        case 'KeyD': case 'ArrowRight': moveState.right = state; break;
      }
    }

    // ILUMINACIÓN GENERAL CÁLIDA
    const ambientLight = new THREE.AmbientLight(0xfff8ee, 1.25);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffeedd, 0.4);
    mainLight.position.set(0, 10, 0);
    scene.add(mainLight);

    // CANDELABRO DE TECHO
    function createChandelier() {
      const group = new THREE.Group();
      const goldMetal = new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.25, metalness: 0.85 });
      const warmLightMat = new THREE.MeshBasicMaterial({ color: 0xffe89c });

      const chain = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.2, 8), goldMetal);
      chain.position.y = -0.6;
      group.add(chain);

      const body = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), goldMetal);
      body.position.y = -1.2;
      group.add(body);

      const armCount = 6;
      for (let i = 0; i < armCount; i++) {
        const angle = (i / armCount) * Math.PI * 2;
        const radius = 0.6;

        const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, radius, 8), goldMetal);
        arm.position.set(Math.cos(angle) * (radius / 2), -1.25, Math.sin(angle) * (radius / 2));
        arm.rotation.z = Math.PI / 2;
        arm.rotation.y = -angle;
        group.add(arm);

        const plate = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.04, 0.04, 12), goldMetal);
        plate.position.set(Math.cos(angle) * radius, -1.2, Math.sin(angle) * radius);
        group.add(plate);

        const candle = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.18, 8), warmLightMat);
        candle.position.set(Math.cos(angle) * radius, -1.1, Math.sin(angle) * radius);
        group.add(candle);
      }

      return group;
    }

    // CREACIÓN DE CUADROS
    const goldFrameMaterial = new THREE.MeshStandardMaterial({ 
      color: 0xc49a2a, 
      roughness: 0.35, 
      metalness: 0.8 
    });

    function createPainting(imagePath) {
      const group = new THREE.Group();

      const frameThick = 0.12;
      const defaultW = 1.5;
      const defaultH = 1.6;

      const frameGeo = new THREE.BoxGeometry(defaultW + frameThick * 2, defaultH + frameThick * 2, 0.06);
      const frameMesh = new THREE.Mesh(frameGeo, goldFrameMaterial);
      frameMesh.position.z = 0.01;
      group.add(frameMesh);

      const canvasMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const canvasGeo = new THREE.PlaneGeometry(defaultW, defaultH);
      const canvasMesh = new THREE.Mesh(canvasGeo, canvasMat);
      canvasMesh.position.z = 0.08;
      group.add(canvasMesh);

      textureLoader.load(imagePath, (texture) => {
        texture.generateMipmaps = true;
        texture.minFilter = THREE.LinearFilter;
        canvasMat.map = texture;
        canvasMat.needsUpdate = true;

        if (texture.image) {
          const aspect = texture.image.width / texture.image.height;
          let height = 1.5;
          let width = height * aspect;

          if (width > 2.0) {
            width = 2.0;
            height = width / aspect;
          }

          canvasMesh.geometry.dispose();
          canvasMesh.geometry = new THREE.PlaneGeometry(width, height);

          frameMesh.geometry.dispose();
          frameMesh.geometry = new THREE.BoxGeometry(width + frameThick * 2, height + frameThick * 2, 0.06);
        }
      });

      return group;
    }

    // ESCULTURAS Y PEDESTAL SÓLIDO
    const statMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.35, metalness: 0.75 });
    const pedestalMat = new THREE.MeshStandardMaterial({ color: 0x1f1f22, roughness: 0.3 });

    function createCatSculpture() {
      const catGroup = new THREE.Group();
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.28, 0.7, 16), statMat);
      body.position.y = 0.35;
      catGroup.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), statMat);
      head.position.y = 0.8;
      catGroup.add(head);
      const earL = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.16, 4), statMat);
      earL.position.set(-0.1, 0.98, 0);
      earL.rotation.z = -0.2;
      catGroup.add(earL);
      const earR = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.16, 4), statMat);
      earR.position.set(0.1, 0.98, 0);
      earR.rotation.z = 0.2;
      catGroup.add(earR);
      const snout = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), statMat);
      snout.position.set(0, 0.78, 0.18);
      catGroup.add(snout);
      const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.5, 8), statMat);
      tail.position.set(0, 0.3, -0.25);
      tail.rotation.x = -0.5;
      catGroup.add(tail);

      return catGroup;
    }

    function createDogSculpture() {
      const dogGroup = new THREE.Group();
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.32, 0.7, 16), statMat);
      body.position.y = 0.35;
      dogGroup.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.23, 16, 16), statMat);
      head.position.y = 0.82;
      dogGroup.add(head);
      const snout = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.12, 0.2), statMat);
      snout.position.set(0, 0.8, 0.2);
      dogGroup.add(snout);
      const earL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.2, 0.08), statMat);
      earL.position.set(-0.2, 0.8, 0.05);
      earL.rotation.z = 0.3;
      dogGroup.add(earL);
      const earR = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.2, 0.08), statMat);
      earR.position.set(0.2, 0.8, 0.05);
      earR.rotation.z = -0.3;
      dogGroup.add(earR);

      return dogGroup;
    }

    // Estructura de Salas
    const roomSpecs = [
      { name: "Sala I", zOffset: 0, pet: "cat" },
      { name: "Sala II", zOffset: -22, pet: "dog" },
      { name: "Sala III", zOffset: -44, pet: "cat" },
      { name: "Sala IV", zOffset: -66, pet: "dog" }
    ];

    const ceilingMat = new THREE.MeshStandardMaterial({ map: ceilingTex, roughness: 0.8 });
    const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.9 });
    const wainscotMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.4 });
    const floorMat = new THREE.MeshStandardMaterial({ map: parquetTex, roughness: 0.25, metalness: 0.05 });

    const paintingsGroup = new THREE.Group();
    scene.add(paintingsGroup);

    // PARED TRASERA DE INICIO DE LA EXHIBICIÓN (SALA I)
    const backWallZ = 11;
    const backWall = new THREE.Mesh(new THREE.BoxGeometry(16, 6, 0.4), wallMat);
    backWall.position.set(0, 3, backWallZ);
    scene.add(backWall);

    const backTrim = new THREE.Mesh(new THREE.BoxGeometry(16, 1.2, 0.45), wainscotMat);
    backTrim.position.set(0, 0.6, backWallZ);
    scene.add(backTrim);

    const entranceDoor = new THREE.Mesh(new THREE.BoxGeometry(3.2, 4.2, 0.5), wainscotMat);
    entranceDoor.position.set(0, 2.1, backWallZ - 0.05);
    scene.add(entranceDoor);

    const doorKnob = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 12), statMat);
    doorKnob.position.set(1.2, 2.0, backWallZ - 0.33);
    scene.add(doorKnob);

    // CONSTRUCCIÓN DE LAS SALAS
    roomSpecs.forEach((room, roomIdx) => {
      const z = room.zOffset;

      // Suelo
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(16, 22), floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(0, 0, z);
      scene.add(floor);

      // Techo
      const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(16, 22), ceilingMat);
      ceiling.rotation.x = Math.PI / 2;
      ceiling.position.set(0, 6, z);
      scene.add(ceiling);

      // Candelabro
      const chandelier = createChandelier();
      chandelier.position.set(0, 6, z);
      scene.add(chandelier);

      // Paredes Laterales
      const wallLeft = new THREE.Mesh(new THREE.PlaneGeometry(22, 6), wallMat);
      wallLeft.rotation.y = Math.PI / 2;
      wallLeft.position.set(-8, 3, z);
      scene.add(wallLeft);

      const wallRight = new THREE.Mesh(new THREE.PlaneGeometry(22, 6), wallMat);
      wallRight.rotation.y = -Math.PI / 2;
      wallRight.position.set(8, 3, z);
      scene.add(wallRight);

      // Zócalos
      const trimLeft = new THREE.Mesh(new THREE.BoxGeometry(22, 1.2, 0.12), wainscotMat);
      trimLeft.rotation.y = Math.PI / 2;
      trimLeft.position.set(-7.94, 0.6, z);
      scene.add(trimLeft);

      const trimRight = new THREE.Mesh(new THREE.BoxGeometry(22, 1.2, 0.12), wainscotMat);
      trimRight.rotation.y = -Math.PI / 2;
      trimRight.position.set(7.94, 0.6, z);
      scene.add(trimRight);

      // PAREDES DIVISORIAS O PARED FINAL DE FONDO
      const wallThickness = 0.4;
      const frontZ = z - 11;

      // Si estamos en la ÚLTIMA SALA (Sala IV), la pared es completa
      if (roomIdx === roomSpecs.length - 1) {
        const endWall = new THREE.Mesh(new THREE.BoxGeometry(16, 6, wallThickness), wallMat);
        endWall.position.set(0, 3, frontZ);
        scene.add(endWall);

        const endTrim = new THREE.Mesh(new THREE.BoxGeometry(16, 1.2, wallThickness + 0.05), wainscotMat);
        endTrim.position.set(0, 0.6, frontZ);
        scene.add(endTrim);
      } else {
        // Para las salas I, II y III: Paredes con apertura abierta / libre (Sin bloque de puerta)
        const divWallLeft = new THREE.Mesh(new THREE.BoxGeometry(5.5, 6, wallThickness), wallMat);
        divWallLeft.position.set(-5.25, 3, frontZ);
        scene.add(divWallLeft);

        const trimFrontL = new THREE.Mesh(new THREE.BoxGeometry(5.5, 1.2, wallThickness + 0.05), wainscotMat);
        trimFrontL.position.set(-5.25, 0.6, frontZ);
        scene.add(trimFrontL);

        const divWallRight = new THREE.Mesh(new THREE.BoxGeometry(5.5, 6, wallThickness), wallMat);
        divWallRight.position.set(5.25, 3, frontZ);
        scene.add(divWallRight);

        const trimFrontR = new THREE.Mesh(new THREE.BoxGeometry(5.5, 1.2, wallThickness + 0.05), wainscotMat);
        trimFrontR.position.set(5.25, 0.6, frontZ);
        scene.add(trimFrontR);

        // Dintel superior para dar formato de umbral elegante
        const divWallTop = new THREE.Mesh(new THREE.BoxGeometry(5, 1.8, wallThickness), wallMat);
        divWallTop.position.set(0, 5.1, frontZ);
        scene.add(divWallTop);
      }

      // Pedestal
      const pedestal = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.1, 1.2), pedestalMat);
      pedestal.position.set(0, 0.55, z);
      scene.add(pedestal);

      // Escultura
      const petSculpture = room.pet === "cat" ? createCatSculpture() : createDogSculpture();
      petSculpture.position.set(0, 1.1, z);
      scene.add(petSculpture);

      // Posicionamiento de los 10 cuadros por sala
      const wallY = 2.6;
      const positions = [
        { pos: [-7.92, wallY, z + 6.5], rot: [0, Math.PI/2, 0] },
        { pos: [-7.92, wallY, z + 2.2], rot: [0, Math.PI/2, 0] },
        { pos: [-7.92, wallY, z - 2.2], rot: [0, Math.PI/2, 0] },
        { pos: [-7.92, wallY, z - 6.5], rot: [0, Math.PI/2, 0] },

        { pos: [7.92, wallY, z + 6.5], rot: [0, -Math.PI/2, 0] },
        { pos: [7.92, wallY, z + 2.2], rot: [0, -Math.PI/2, 0] },
        { pos: [7.92, wallY, z - 2.2], rot: [0, -Math.PI/2, 0] },
        { pos: [7.92, wallY, z - 6.5], rot: [0, -Math.PI/2, 0] },

        { pos: [-5.2, wallY, frontZ + 0.25], rot: [0, 0, 0] },
        { pos: [5.2, wallY, frontZ + 0.25], rot: [0, 0, 0] }
      ];

      positions.forEach((p, idx) => {
        const globalIdx = roomIdx * 10 + idx;
        if (misFotos[globalIdx]) {
          const painting = createPainting(misFotos[globalIdx]);
          painting.position.set(...p.pos);
          painting.rotation.set(...p.rot);
          paintingsGroup.add(painting);
        }
      });
    });

    // Bucle de Animación
    let prevTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      const delta = (time - prevTime) / 1000;
      prevTime = time;

      if (controls.isLocked) {
        velocity.x -= velocity.x * 8.0 * delta;
        velocity.z -= velocity.z * 8.0 * delta;

        direction.z = Number(moveState.forward) - Number(moveState.backward);
        direction.x = Number(moveState.right) - Number(moveState.left);
        direction.normalize();

        const speed = 22.0;
        if (moveState.forward || moveState.backward) velocity.z -= direction.z * speed * delta;
        if (moveState.left || moveState.right) velocity.x -= direction.x * speed * delta;

        controls.moveRight(-velocity.x * delta);
        controls.moveForward(-velocity.z * delta);

        // Límites de la cámara
        camera.position.x = Math.max(-7.0, Math.min(7.0, camera.position.x));
        camera.position.z = Math.max(-76.0, Math.min(9.5, camera.position.z));
        camera.position.y = 1.7;

        const camZ = camera.position.z;
        if (camZ > -11) {
          hud.innerHTML = `Ala Principal: <b>${roomSpecs[0].name}</b>`;
        } else if (camZ > -33) {
          hud.innerHTML = `Ala Principal: <b>${roomSpecs[1].name}</b>`;
        } else if (camZ > -55) {
          hud.innerHTML = `Ala Principal: <b>${roomSpecs[2].name}</b>`;
        } else {
          hud.innerHTML = `Ala Principal: <b>${roomSpecs[3].name}</b>`;
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
